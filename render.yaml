# =============================================================================
# Render Blueprint — the CampusConnect API
#
# Render dashboard → New → Blueprint → pick this repository. Render reads this
# file and creates the service with the right build/start commands, health check
# and environment variables.
#
# Secrets are marked `sync: false`, which means Render asks you for them once in
# the dashboard and never stores them in this file. JWT_SECRET and OTP_PEPPER are
# generated by Render itself.
#
# The frontend is NOT here: it goes to Vercel (see docs/DEPLOYMENT.md).
# =============================================================================

services:
  - type: web
    name: campusconnect-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true

    # `npm ci` uses the lockfile exactly, so the deployed tree matches CI.
    buildCommand: npm ci

    # Migrations run on every boot. They are idempotent (tracked in
    # schema_migrations), so this is safe, and a broken database fails the
    # deploy loudly instead of serving 500s.
    startCommand: npm run migrate && npm start

    # Render polls this; the app returns 503 when the database is unreachable,
    # so a sick instance is taken out of rotation.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # --- database (Supabase) ---------------------------------------------
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "10"

      # --- secrets: Render generates and keeps these -----------------------
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true

      # --- tokens and sessions ---------------------------------------------
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: BCRYPT_ROUNDS
        value: "12"

      # --- university email restriction ------------------------------------
      # Confirmed with the university. The parent domain covers sub-domains such
      # as scds.saiuniversity.edu.in automatically.
      - key: ALLOWED_EMAIL_DOMAINS
        value: saiuniversity.edu.in
      - key: REQUIRE_EMAIL_DOMAIN
        value: "true"

      # --- OTP policy -------------------------------------------------------
      - key: OTP_TTL_MINUTES
        value: "5"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: OTP_MAX_PER_HOUR
        value: "6"
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "30"

      # --- listings ---------------------------------------------------------
      - key: ITEM_EXPIRY_DAYS
        value: "60"
      - key: ITEM_EXPIRY_WARN_DAYS
        value: "7"

      # --- public URL and CORS ---------------------------------------------
      # APP_URL must be the Vercel URL: email links are built from it.
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: "1"

      # --- email (SMTP) -----------------------------------------------------
      - key: MAIL_TRANSPORT
        value: smtp
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # --- image storage: must be Supabase in production -------------------
      # Render's disk is ephemeral; local uploads vanish on the next deploy.
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_PUBLIC
        value: item-images
      - key: SUPABASE_BUCKET_PRIVATE
        value: claim-evidence
      - key: MAX_UPLOAD_MB
        value: "5"

      # --- limits and logging ----------------------------------------------
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "600"
      - key: RATE_LIMIT_AUTH_MAX
        value: "30"
      - key: RATE_LIMIT_OTP_MAX
        value: "10"
      - key: RATE_LIMIT_WRITE_MAX
        value: "60"
      - key: LOG_LEVEL
        value: info
