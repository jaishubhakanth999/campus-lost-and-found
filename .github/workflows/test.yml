name: test

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check every source file
        run: |
          find src scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check server.js

      - name: Verify the configuration layer rejects a broken setup
        run: |
          if node -e "require('./src/config/env').buildConfig({})" 2>/dev/null; then
            echo "::error::config validation accepted an empty environment"
            exit 1
          fi
          echo "config validation correctly rejects a missing setup"

      - name: Run the test suite
        # The suite starts a real PostgreSQL server (PGlite, WebAssembly) over TCP,
        # applies the migrations and drives the HTTP API. No external services.
        run: npm test

      - name: Dependency audit (informational)
        continue-on-error: true
        run: npm audit --omit=dev
